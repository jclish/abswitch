<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>abswitch operator</title>
<!-- Served by takectl at GET /. Self-contained: no build step, no CDN, no fonts to fetch, so it
     works on an iPad on a show network with no internet. Polls /state every 250 ms. -->
<style>
  :root {
    --bg: #0d0f12; --panel: #171a1f; --line: #2a2f37; --text: #e9edf2; --muted: #9aa3ad;
    --pgm: #e8202a; --pvw: #19b34a; --idle: #3a4049; --warn: #f2a516; --err: #ff5a5f;
    --take: #d0151f; --take-hi: #f02a35; --btn: #262b33; --btn-hi: #323843;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; gap: 14px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { position: relative; aspect-ratio: 16 / 9; border: 12px solid var(--idle); border-radius: 6px; background: #000; overflow: hidden; transition: border-color 80ms linear; }
  .tile[data-border="red"] { border-color: var(--pgm); }
  .tile[data-border="green"] { border-color: var(--pvw); }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .label { position: absolute; left: 10px; top: 8px; display: flex; align-items: baseline; gap: 10px; text-shadow: 0 1px 4px #000; }
  .tile .letter { font-size: 44px; font-weight: 800; line-height: 1; }
  .tile .role { font-size: 18px; font-weight: 800; letter-spacing: .08em; padding: 3px 9px; border-radius: 4px; background: rgba(0,0,0,.55); }
  .tile[data-border="red"] .role { background: var(--pgm); }
  .tile[data-border="green"] .role { background: var(--pvw); }
  .tile .name { position: absolute; left: 12px; bottom: 8px; font-size: 13px; color: #fff; opacity: .85; text-shadow: 0 1px 3px #000; }
  .tile .nofeed { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); font-size: 15px; }
  .tile[data-feed="lost"] .nofeed { display: grid; }
  .tile[data-feed="lost"] img { visibility: hidden; }
  body[data-conn="offline"] .tile img { filter: grayscale(1) brightness(.45); }
  body[data-conn="offline"] .tile { border-color: var(--idle); }
  .offline { display: none; position: fixed; inset: 0; z-index: 5; place-items: center; pointer-events: none; }
  .offline span { background: rgba(20,22,26,.92); border: 2px solid var(--muted); color: var(--text); font-size: 34px; font-weight: 800; padding: 18px 30px; border-radius: 10px; }
  body[data-conn="offline"] .offline { display: grid; }

  .sets { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sets .caption { color: var(--pvw); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
  .sets button { min-height: 52px; padding: 0 18px; font-size: 18px; }

  .transport { display: grid; grid-template-columns: 3fr 1fr 1fr 0.5fr 1.4fr; gap: 14px; }
  button { font: inherit; font-weight: 700; color: var(--text); background: var(--btn); border: 2px solid var(--line); border-radius: 10px; cursor: pointer; touch-action: manipulation; }
  button:active:not(:disabled) { background: var(--btn-hi); }
  button:focus-visible { outline: 3px solid #7fb2ff; outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .transport button { min-height: 96px; font-size: 26px; letter-spacing: .04em; }
  #take { background: var(--take); border-color: var(--take-hi); font-size: 40px; }
  #take:active:not(:disabled) { background: var(--take-hi); }
  .key { display: block; font-size: 12px; font-weight: 600; opacity: .7; letter-spacing: .1em; margin-top: 4px; }
  #panic { grid-column: 5; position: relative; overflow: hidden; background: #1d0f10; border-color: var(--pgm); color: #ffb3b6; }
  #panic .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--pgm); opacity: .55; pointer-events: none; }
  #panic .txt { position: relative; }
  #panic[data-armed="1"] { background: #5a1014; color: #fff; }

  .status { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 18px; }
  .status .k { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
  #roles { font-size: 24px; font-weight: 800; }
  #roles .pgm { color: var(--pgm); } #roles .pvw { color: var(--pvw); }
  #warning { color: var(--warn); font-weight: 700; }
  #lastError { color: var(--err); font-weight: 700; }
  #lastError .age { color: var(--muted); font-weight: 600; }
  .none { color: var(--muted); font-weight: 400; }

  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 10; max-width: min(92vw, 1100px); padding: 18px 26px; border-radius: 12px; font-size: 28px; font-weight: 800; line-height: 1.25; box-shadow: 0 8px 30px rgba(0,0,0,.6); display: none; }
  .toast[data-kind="error"] { background: #b3121b; color: #fff; display: block; }
  .toast[data-kind="info"] { background: #1f2a38; color: #fff; border: 2px solid #4b6a8f; display: block; }

  @media (max-width: 760px) {
    .tiles { grid-template-columns: 1fr; }
    .transport { grid-template-columns: 1fr 1fr; }
    #take { grid-column: 1 / -1; }
    #panic { grid-column: 1 / -1; }
    .gap { display: none; }
  }
</style>
</head>
<body data-conn="connecting">
  <div class="tiles">
    <div class="tile" id="tileA" data-border="grey" data-feed="ok">
      <img id="imgA" alt="Program output of document A">
      <div class="nofeed">no picture from document A</div>
      <div class="label"><span class="letter">A</span><span class="role" id="roleA">—</span></div>
      <div class="name" id="nameA"></div>
    </div>
    <div class="tile" id="tileB" data-border="grey" data-feed="ok">
      <img id="imgB" alt="Program output of document B">
      <div class="nofeed">no picture from document B</div>
      <div class="label"><span class="letter">B</span><span class="role" id="roleB">—</span></div>
      <div class="name" id="nameB"></div>
    </div>
  </div>

  <div class="sets" id="sets"><span class="caption">Look in PVW (green)</span></div>

  <div class="transport">
    <button id="take" disabled>TAKE<span class="key">SPACE</span></button>
    <button id="cut" disabled>CUT<span class="key">C</span></button>
    <button id="mirror" disabled>MIRROR<span class="key">M</span></button>
    <span class="gap"></span>
    <button id="panic"><span class="fill"></span><span class="txt" id="panicTxt">PANIC<span class="key">HOLD · OR TAP TWICE</span></span></button>
  </div>

  <div class="status">
    <span class="k">On air</span><span id="roles" class="none">waiting for takectl…</span>
    <span class="k">Last</span><span id="last" class="none">—</span>
    <span class="k">Warning</span><span id="warning" class="none">none</span>
    <span class="k">Error</span><span id="lastError" class="none">none</span>
  </div>

  <div class="offline"><span>takectl unreachable</span></div>
  <div class="toast" id="toast" role="status" aria-live="assertive"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const POLL_MS = 250, OFFLINE_AFTER_MS = 2000, PANIC_HOLD_MS = 700, PANIC_TAP_WINDOW_MS = 1000;
let state = null, lastOk = Date.now(), pending = false, setsKey = "";

// ---- toast: one line, big enough to read from arm's length
let toastTimer = null;
function toast(msg, kind = "error") {
  const t = $("toast");
  t.textContent = msg;
  t.dataset.kind = kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.dataset.kind = ""; }, kind === "error" ? 6000 : 2500);
}
$("toast").addEventListener("click", () => { $("toast").dataset.kind = ""; });

// ---- program-out pictures. A document host of localhost means "the Mac takectl runs on": from
// another device that is the host this page came from, so substitute it (CORS is not involved,
// these are plain <img> requests).
function feedUrl(doc) {
  if (!doc || !doc.host || !doc.id) return null;
  const u = new URL(doc.host);
  const loopback = ["localhost", "127.0.0.1", "[::1]", "::1"];
  if (loopback.includes(u.hostname) && !loopback.includes(location.hostname)) u.hostname = location.hostname;
  return `${u.origin}/api/v1/documents/${encodeURIComponent(doc.id)}/programOut?format=mjpeg&fps=10&width=960`;
}
function setFeed(role, doc) {
  const img = $("img" + role), tile = $("tile" + role), url = feedUrl(doc);
  if (!url || img.dataset.base === url) return;
  img.dataset.base = url;
  img.src = url;
}
for (const role of ["A", "B"]) {
  const img = $("img" + role), tile = $("tile" + role);
  img.addEventListener("load", () => { tile.dataset.feed = "ok"; });
  img.addEventListener("error", () => {
    tile.dataset.feed = "lost";
    setTimeout(() => { if (img.dataset.base) img.src = img.dataset.base + "&t=" + Date.now(); }, 2000);
  });
}

function age(ms) {
  const sec = Math.max(0, Math.round(ms / 1000));
  if (sec < 60) return sec + " s ago";
  const min = Math.round(sec / 60);
  return min < 60 ? min + " min ago" : Math.round(min / 60) + " h ago";
}

// ---- render /state
function render() {
  const s = state;
  const offline = document.body.dataset.conn === "offline";
  const inFlight = !!(s && s.switcher && s.switcher.inFlight);
  const busy = !!(s && (s.busy || inFlight));
  for (const role of ["A", "B"]) {
    const tile = $("tile" + role), roleEl = $("role" + role);
    let border = "grey", label = "—";
    if (s && s.pgm && !offline) {
      if (busy) { border = "red"; label = "TRANSITION"; }
      else if (s.pgm === role) { border = "red"; label = "PGM"; }
      else { border = "green"; label = "PVW"; }
    }
    tile.dataset.border = border;
    roleEl.textContent = label;
    $("name" + role).textContent = s && s.docs && s.docs[role] ? s.docs[role].name || "" : "";
    if (s && s.docs) setFeed(role, s.docs[role]);
  }
  const ready = !!(s && s.pgm) && !offline;
  $("take").disabled = !ready || busy || pending;
  $("cut").disabled = !ready || busy || pending;
  $("mirror").disabled = !ready || busy || pending;
  for (const b of document.querySelectorAll("#sets button")) b.disabled = !ready || busy || pending;
  $("panic").disabled = offline;

  if (s && s.pgm) {
    $("roles").className = "";
    $("roles").innerHTML = "";
    const pg = document.createElement("span"); pg.className = "pgm"; pg.textContent = "PGM " + s.pgm;
    const pv = document.createElement("span"); pv.className = "pvw"; pv.textContent = "PVW " + s.pvw;
    $("roles").append(pg, document.createTextNode("  ·  "), pv, document.createTextNode(busy ? "  ·  in transition" : ""));
  } else if (s) {
    $("roles").className = "none"; $("roles").textContent = "PGM unknown";
  }
  const lt = s && s.lastTake;
  $("last").className = lt ? "" : "none";
  $("last").textContent = lt
    ? `${lt.kind.toUpperCase()} → ${lt.target}${lt.transition ? " · " + lt.transition : ""}${lt.transition === "dissolve" ? " " + lt.ms + " ms" : ""} · ${new Date(lt.ts).toLocaleTimeString()}`
    : "—";
  $("warning").className = s && s.warning ? "" : "none";
  $("warning").textContent = s && s.warning ? s.warning : "none";
  // The error stays until the next successful TAKE/CUT/PANIC; its age (from takectl's clock) lets a
  // stale one read as stale.
  const le = $("lastError");
  le.className = s && s.lastError ? "" : "none";
  le.textContent = s && s.lastError ? s.lastError : "none";
  if (s && s.lastError && s.lastErrorAgeMs != null) {
    const a = document.createElement("span");
    a.className = "age";
    a.textContent = "  ·  " + age(s.lastErrorAgeMs);
    le.append(a);
  }

  const key = JSON.stringify(s && s.layerSets || []);
  if (key !== setsKey) {
    setsKey = key;
    const box = $("sets");
    box.querySelectorAll("button").forEach((b) => b.remove());
    for (const name of (s && s.layerSets) || []) {
      const b = document.createElement("button");
      b.textContent = name;
      b.addEventListener("click", () => act("/pvw/layer-set/" + encodeURIComponent(name), name));
      box.append(b);
    }
  }
}

// ---- poll
async function poll() {
  const ctl = new AbortController(); // manual timeout: AbortSignal.timeout is missing on older iPad Safari
  const timer = setTimeout(() => ctl.abort(), 1500);
  try {
    const r = await fetch("/state", { cache: "no-store", signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
    lastOk = Date.now();
    document.body.dataset.conn = "ok";
  } catch {
    if (Date.now() - lastOk > OFFLINE_AFTER_MS) document.body.dataset.conn = "offline";
  } finally {
    clearTimeout(timer);
  }
  render();
  setTimeout(poll, POLL_MS);
}

// ---- actions
async function act(route, label) {
  if (pending && route !== "/panic") return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // Space must mean TAKE, not "press the focused button"
  pending = route !== "/panic";
  render();
  try {
    const r = await fetch(route, { cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || body.ok === false) toast(body.error || `${label || route} failed (HTTP ${r.status})`, "error");
    else if (route === "/panic") toast(body.superseded ? "PANIC: taken over by a later press" : `PANIC: A on air (${body.rounds} round${body.rounds === 1 ? "" : "s"})`, "info");
    else if (route.startsWith("/pvw/layer-set/")) toast(`${body.layerSet} → ${body.pvw}`, "info");
  } catch (e) {
    toast(`${label || route}: takectl did not answer`, "error");
  } finally {
    if (route !== "/panic") pending = false;
    render();
  }
}
$("take").addEventListener("click", () => act("/take", "TAKE"));
$("cut").addEventListener("click", () => act("/cut", "CUT"));
$("mirror").addEventListener("click", () => act("/mirror", "MIRROR"));

// Space = TAKE, C = CUT, M = MIRROR. Nothing for PANIC by design.
document.addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { " ": "take", c: "cut", C: "cut", m: "mirror", M: "mirror" };
  const id = map[e.key];
  if (!id) return;
  e.preventDefault();
  if (!$(id).disabled) $(id).click();
});

// ---- PANIC: hold 700 ms, or two taps within 1 s
(() => {
  const btn = $("panic"), fill = btn.querySelector(".fill"), txt = $("panicTxt");
  let holdTimer = null, fired = false, armedUntil = 0, armTimer = null;
  const idleText = () => { txt.innerHTML = 'PANIC<span class="key">HOLD · OR TAP TWICE</span>'; btn.dataset.armed = ""; };
  const fire = () => {
    fired = true;
    armedUntil = 0; clearTimeout(armTimer); idleText();
    fill.style.transition = "none"; fill.style.width = "0";
    act("/panic", "PANIC");
  };
  const start = (e) => {
    if (btn.disabled) return;
    e.preventDefault();
    fired = false;
    fill.style.transition = `width ${PANIC_HOLD_MS}ms linear`;
    fill.style.width = "100%";
    holdTimer = setTimeout(fire, PANIC_HOLD_MS);
  };
  const end = (e) => {
    if (holdTimer == null) return;
    clearTimeout(holdTimer); holdTimer = null;
    fill.style.transition = "none"; fill.style.width = "0";
    if (fired || e.type === "pointercancel" || e.type === "pointerleave") return;
    if (Date.now() < armedUntil) return fire();
    armedUntil = Date.now() + PANIC_TAP_WINDOW_MS;
    btn.dataset.armed = "1";
    txt.innerHTML = 'TAP AGAIN<span class="key">TO PANIC</span>';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { armedUntil = 0; idleText(); }, PANIC_TAP_WINDOW_MS);
  };
  btn.addEventListener("pointerdown", start);
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointercancel", end);
  btn.addEventListener("pointerleave", end);
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
  btn.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") e.preventDefault(); }); // keyboard cannot panic
})();

poll();
</script>
</body>
</html>
