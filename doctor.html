<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abswitch doctor</title>
<!-- Served by takectl at /doctor: the same checks as `node takectl.mjs doctor`, as lights. -->
<style>
  :root { --bg: #0d0f12; --panel: #171a1f; --line: #2a2f37; --text: #e9edf2; --muted: #9aa3ad; --ok: #19b34a; --err: #ff5a5f; --acc: #4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  #summary { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  #summary.good { color: var(--ok); } #summary.bad { color: var(--err); }
  .meta { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 22px 1fr; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin: 0 0 8px; }
  li .dot { width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; background: var(--ok); }
  li.bad { border-color: var(--err); }
  li.bad .dot { background: var(--err); }
  li .label { font-weight: 700; }
  li .fix { grid-column: 2; color: #f5c9ca; }
  .warn { color: #f2a516; font-weight: 700; margin: 0 0 8px; }
  a { color: var(--acc); }
  button { font: inherit; font-weight: 700; color: var(--text); background: #262b33; border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>abswitch doctor</h1>
  <p id="summary">Checking…</p>
  <p id="warnings" class="warn" hidden></p>
  <p class="meta"><span id="mode"></span> · checked <span id="at">—</span> · <button id="again">Check again</button> · <a href="/">Operator page</a> · <a href="/setup">Setup</a></p>
  <ul id="list"></ul>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
async function run() {
  let d;
  try { d = await (await fetch("/doctor.json", { cache: "no-store" })).json(); }
  catch { $("summary").className = "bad"; $("summary").textContent = "takectl does not answer"; return; }
  const checks = d.checks || [], bad = checks.filter((c) => !c.ok);
  $("summary").className = bad.length ? "bad" : "good";
  $("summary").textContent = bad.length ? `${bad.length} of ${checks.length} checks failing` : `All ${checks.length} checks pass`;
  $("mode").textContent = d.mode === "running" ? "takectl is running" : d.mode === "setup" ? "takectl is not set up yet" : `takectl is starting${d.startError ? ": " + d.startError : ""}`;
  $("at").textContent = new Date().toLocaleTimeString();
  const w = d.warnings || [];
  $("warnings").hidden = !w.length;
  $("warnings").textContent = w.length ? "Warnings (not failures): " + w.join(" · ") : "";
  const list = $("list");
  list.textContent = "";
  for (const c of checks) {
    const li = document.createElement("li");
    li.className = c.ok ? "good" : "bad";
    li.dataset.id = c.id;
    const dot = document.createElement("span"); dot.className = "dot"; dot.setAttribute("aria-label", c.ok ? "pass" : "fail");
    const label = document.createElement("span"); label.className = "label"; label.textContent = c.label;
    li.append(dot, label);
    if (!c.ok) { const fix = document.createElement("span"); fix.className = "fix"; fix.textContent = c.fix; li.append(fix); }
    list.append(li);
  }
}
$("again").addEventListener("click", run);
run();
setInterval(run, 5000);
</script>
</body>
</html>
